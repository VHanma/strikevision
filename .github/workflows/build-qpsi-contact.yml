name: Build Q Psi Contact APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'qpsi-contact/**'
      - '.github/workflows/build-qpsi-contact.yml'

permissions:
  contents: read

jobs:
  build-qpsi-contact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat qpsi-contact/source/fixed-*.b64 > QPsiContact_Source.zip.b64
          base64 --decode QPsiContact_Source.zip.b64 > QPsiContact_Source.zip
          echo "97fef1c33377289dfce3284b488aaddafefaab7a67c184d7d3565f4aead1dd99  QPsiContact_Source.zip" | sha256sum -c -
          rm -rf qpsi-contact/build
          mkdir -p qpsi-contact/build
          unzip -q QPsiContact_Source.zip -d qpsi-contact/build

      - name: Apply immersive playback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("qpsi-contact/build/qpsi_project/app/src/main/java/com/aether/qpsicontact/MainActivity.kt")
          text = path.read_text()

          text = text.replace(
              "import android.os.Bundle\nimport android.os.SystemClock\nimport android.view.WindowManager\n",
              "import android.os.Build\nimport android.os.Bundle\nimport android.os.SystemClock\nimport android.view.View\nimport android.view.WindowInsets\nimport android.view.WindowInsetsController\nimport android.view.WindowManager\n",
          )

          old_effect = '''    DisposableEffect(running) {
              val activity = context as? ComponentActivity
              val previous = activity?.window?.attributes?.screenBrightness ?: -1f
              if (running && activity != null) {
                  activity.window.attributes = activity.window.attributes.apply { screenBrightness = 1f }
              }
              onDispose {
                  if (activity != null) {
                      activity.window.attributes = activity.window.attributes.apply { screenBrightness = previous }
                  }
              }
          }
          '''

          new_effect = '''    DisposableEffect(running) {
              val activity = context as? ComponentActivity
              val previousBrightness = activity?.window?.attributes?.screenBrightness ?: -1f
              @Suppress("DEPRECATION")
              val previousSystemUi = activity?.window?.decorView?.systemUiVisibility ?: 0

              if (running && activity != null) {
                  activity.window.attributes = activity.window.attributes.apply { screenBrightness = 1f }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      activity.window.setDecorFitsSystemWindows(false)
                      activity.window.insetsController?.apply {
                          hide(WindowInsets.Type.systemBars())
                          systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      activity.window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                              View.SYSTEM_UI_FLAG_FULLSCREEN or
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          )
                  }
              }

              onDispose {
                  if (activity != null) {
                      activity.window.attributes = activity.window.attributes.apply {
                          screenBrightness = previousBrightness
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          activity.window.setDecorFitsSystemWindows(true)
                          activity.window.insetsController?.show(WindowInsets.Type.systemBars())
                      } else {
                          @Suppress("DEPRECATION")
                          activity.window.decorView.systemUiVisibility = previousSystemUi
                      }
                  }
              }
          }
          '''

          if old_effect not in text:
              raise SystemExit("Brightness effect block not found")
          text = text.replace(old_effect, new_effect, 1)

          old_column = '''        Column(
              modifier = Modifier
                  .fillMaxSize()
                  .verticalScroll(rememberScrollState())
                  .padding(horizontal = 16.dp, vertical = 18.dp),
              horizontalAlignment = Alignment.CenterHorizontally,
          ) {
          '''

          new_column = '''        if (running) {
              RunningSessionOverlay(
                  mode = mode,
                  profile = if (mode == ContactMode.FUSION) BeaconEngine.Profile.PSI_FUSION else profile,
                  pulse = pulse,
                  elapsedSeconds = elapsedMs / 1000L,
                  currentPhase = phaseInfo.first,
                  phaseRemaining = phaseInfo.second,
                  onStop = { stopSession() },
              )
          } else {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(horizontal = 16.dp, vertical = 18.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
              ) {
          '''

          if old_column not in text:
              raise SystemExit("Main menu column not found")
          text = text.replace(old_column, new_column, 1)

          old_tail = '''            Spacer(Modifier.height(24.dp))
          }
      }
  }

  @Composable
  private fun ContactControls(
          '''

          overlay = '''                Spacer(Modifier.height(24.dp))
              }
          }
      }
  }

  @Composable
  private fun RunningSessionOverlay(
      mode: ContactMode,
      profile: BeaconEngine.Profile,
      pulse: BeaconEngine.Pulse,
      elapsedSeconds: Long,
      currentPhase: Phase?,
      phaseRemaining: Long,
      onStop: () -> Unit,
  ) {
      Box(
          modifier = Modifier
              .fillMaxSize()
              .padding(horizontal = 22.dp, vertical = 18.dp),
      ) {
          Column(
              modifier = Modifier
                  .align(Alignment.TopCenter)
                  .fillMaxWidth(),
              horizontalAlignment = Alignment.CenterHorizontally,
          ) {
              Text(
                  text = "TRANSMITTING",
                  color = Color(0xFFFFE27A),
                  fontWeight = FontWeight.Black,
                  fontSize = 18.sp,
                  letterSpacing = 2.4.sp,
              )
              Text(
                  text = formatClock(elapsedSeconds),
                  color = Color.White,
                  fontSize = 52.sp,
                  fontWeight = FontWeight.Black,
                  modifier = Modifier.padding(top = 4.dp),
              )
              Text(
                  text = when (mode) {
                      ContactMode.PSIONIC -> "PSIONIC RECEPTIVE FIELD"
                      else -> "${profile.title.uppercase()} • ${pulse.frequencyHz.toInt()} Hz"
                  },
                  color = Color(0xFF8DEBFF),
                  fontWeight = FontWeight.Bold,
                  fontSize = 13.sp,
                  letterSpacing = 1.2.sp,
              )
          }

          if (mode != ContactMode.Q_SIGNAL && currentPhase != null) {
              Card(
                  modifier = Modifier
                      .align(Alignment.Center)
                      .fillMaxWidth(),
                  colors = CardDefaults.cardColors(
                      containerColor = Color.Black.copy(alpha = 0.58f),
                  ),
                  shape = RoundedCornerShape(22.dp),
                  border = BorderStroke(1.dp, Color(0xFFD6B7FF).copy(alpha = 0.35f)),
              ) {
                  Column(
                      modifier = Modifier.padding(18.dp),
                      horizontalAlignment = Alignment.CenterHorizontally,
                  ) {
                      Text(
                          text = currentPhase.title.uppercase(),
                          color = Color(0xFFD6B7FF),
                          fontWeight = FontWeight.Black,
                          fontSize = 18.sp,
                          textAlign = TextAlign.Center,
                      )
                      Text(
                          text = currentPhase.cue,
                          color = Color.White.copy(alpha = 0.88f),
                          fontSize = 15.sp,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.padding(top = 10.dp),
                      )
                      Text(
                          text = "NEXT PHASE IN ${formatClock(phaseRemaining.coerceAtLeast(0L))}",
                          color = Color.White.copy(alpha = 0.55f),
                          fontSize = 11.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 1.sp,
                          modifier = Modifier.padding(top = 14.dp),
                      )
                  }
              }
          }

          Button(
              onClick = onStop,
              modifier = Modifier
                  .align(Alignment.BottomCenter)
                  .fillMaxWidth()
                  .height(70.dp),
              shape = RoundedCornerShape(24.dp),
              colors = ButtonDefaults.buttonColors(
                  containerColor = Color(0xFFFF3F5F),
                  contentColor = Color.White,
              ),
          ) {
              Text(
                  text = "STOP + SAVE SESSION",
                  fontWeight = FontWeight.Black,
                  fontSize = 17.sp,
                  letterSpacing = 1.sp,
              )
          }
      }
  }

  @Composable
  private fun ContactControls(
          '''

          if old_tail not in text:
              raise SystemExit("Menu tail not found")
          text = text.replace(old_tail, overlay, 1)
          path.write_text(text)

          gradle = Path("qpsi-contact/build/qpsi_project/app/build.gradle.kts")
          build_text = gradle.read_text()
          build_text = build_text.replace("versionCode = 1", "versionCode = 2")
          build_text = build_text.replace('versionName = "1.0.0"', 'versionName = "1.0.1-fullscreen"')
          gradle.write_text(build_text)
          PY

      - name: Build installable APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p qpsi-contact/build/qpsi_project --no-daemon clean assembleDebug --stacktrace 2>&1 | tee qpsi-contact-build.log

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p qpsi-contact-output
          cp qpsi-contact/build/qpsi_project/app/build/outputs/apk/debug/app-debug.apk qpsi-contact-output/Q-Psi-Contact-Fullscreen.apk
          sha256sum qpsi-contact-output/Q-Psi-Contact-Fullscreen.apk > qpsi-contact-output/Q-Psi-Contact-Fullscreen.apk.sha256
          cp qpsi-contact-build.log qpsi-contact-output/build.log

      - name: Upload installable APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Q-Psi-Contact-fullscreen-apk
          path: qpsi-contact-output/*
          if-no-files-found: warn

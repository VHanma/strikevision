name: R3 MaxSight 100X Enhanced Runtime-Tested APK

on:
  push:
    branches: [r3-maxsight100x-enhanced]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct R3 Plus
        shell: bash
        run: |
          echo '[... ELLIPSIZATION ...]' | base64 -d > /tmp/r3plus.zip
          rm -rf /tmp/r3plus && mkdir -p /tmp/r3plus
          unzip -q /tmp/r3plus.zip -d /tmp/r3plus
      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed APK
        working-directory: /tmp/r3plus/MaxSight100X-R3Plus-src
        run: gradle --no-daemon :app:assembleDebug
      - name: Create runtime smoke script
        run: |
          cat > /tmp/r3plus-smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          APK=/tmp/r3plus/MaxSight100X-R3Plus-src/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          adb logcat -c
          adb shell pm grant com.hanma.maxsight.r3plus android.permission.CAMERA || true
          adb shell pm grant com.hanma.maxsight.r3plus android.permission.RECORD_AUDIO || true
          adb shell am force-stop com.hanma.maxsight.r3plus
          adb shell am start -W -n com.hanma.maxsight.r3plus/.MainActivity
          sleep 12
          adb logcat -d > /tmp/r3plus-logcat.txt
          PID="$(adb shell pidof com.hanma.maxsight.r3plus | tr -d '\r')"
          echo "PID=$PID"
          if [ -z "$PID" ]; then
            echo 'R3PLUS PROCESS DIED'
            grep -A120 -B30 -E 'AndroidRuntime|FATAL EXCEPTION|com.hanma.maxsight.r3plus' /tmp/r3plus-logcat.txt | tail -350 || true
            exit 1
          fi
          if grep -qE 'FATAL EXCEPTION.*|Process: com.hanma.maxsight.r3plus' /tmp/r3plus-logcat.txt; then
            echo 'R3PLUS FATAL EXCEPTION FOUND'
            grep -A120 -B30 -E 'FATAL EXCEPTION|Process: com.hanma.maxsight.r3plus' /tmp/r3plus-logcat.txt | tail -350 || true
            exit 1
          fi
          echo R3PLUS_RUNTIME_LAUNCH_OK
          EOF
          chmod +x /tmp/r3plus-smoke.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Runtime launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: /tmp/r3plus-smoke.sh
      - name: Stage APK
        run: cp /tmp/r3plus/MaxSight100X-R3Plus-src/app/build/outputs/apk/debug/app-debug.apk /tmp/MaxSight100X-R3Plus-RUNTIME-TESTED.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxSight100X-R3Plus-RUNTIME-TESTED
          path: /tmp/MaxSight100X-R3Plus-RUNTIME-TESTED.apk
          if-no-files-found: error

name: Infinity Vault APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Infinity Vault source
        shell: bash
        run: |
          cat .ivsrc/part00.txt .ivsrc/part01.txt .ivsrc/part02.txt .ivsrc/part03.txt | base64 -d > infinity-vault-source.zip
          unzip -q infinity-vault-source.zip
          test -f infinity-vault/app/src/main/java/com/vhanma/infinityvault/MainActivity.java

      - name: Apply Android Keystore IV hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('infinity-vault/app/src/main/java/com/vhanma/infinityvault/MainActivity.java')
          s = p.read_text()
          old = '''            byte[] iv = new byte[12];
                      random.nextBytes(iv);
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey(), new GCMParameterSpec(128, iv));
                      cipher.updateAAD(hash.getBytes(StandardCharsets.UTF_8));
                      byte[] encrypted = cipher.doFinal(payload);
          '''
          new = '''            Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, getOrCreateKey());
                      byte[] iv = cipher.getIV();
                      if (iv == null || iv.length < 8 || iv.length > 32) {
                          throw new java.security.GeneralSecurityException("Android Keystore did not provide a valid GCM IV.");
                      }
                      cipher.updateAAD(hash.getBytes(StandardCharsets.UTF_8));
                      byte[] encrypted = cipher.doFinal(payload);
          '''
          if old not in s:
              raise SystemExit('Expected AES-GCM encryption block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: infinity-vault
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          cp infinity-vault/app/build/outputs/apk/debug/app-debug.apk InfinityVault-v1.0.1-debug.apk
          sha256sum InfinityVault-v1.0.1-debug.apk > InfinityVault-v1.0.1-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InfinityVault-APK-v1.0.1
          path: |
            InfinityVault-v1.0.1-debug.apk
            InfinityVault-v1.0.1-debug.apk.sha256
          if-no-files-found: error

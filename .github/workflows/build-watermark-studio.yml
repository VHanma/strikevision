name: Build Watermark Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ watermark-studio ]
    paths:
      - 'watermark-studio-source/**'
      - '.github/workflows/build-watermark-studio.yml'

permissions:
  contents: write

jobs:
  build-watermark-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct and build APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf watermark-studio-build watermark-studio-apk WatermarkStudio-source.zip
          mkdir -p watermark-studio-build watermark-studio-apk
          cat watermark-studio-source/part-*.b64 | base64 --decode > WatermarkStudio-source.zip
          unzip -q WatermarkStudio-source.zip -d watermark-studio-build
          cd watermark-studio-build/WatermarkStudio
          gradle --no-daemon clean assembleDebug --stacktrace
          cd ../..
          cp watermark-studio-build/WatermarkStudio/app/build/outputs/apk/debug/app-debug.apk watermark-studio-apk/WatermarkStudio.apk
          sha256sum watermark-studio-apk/WatermarkStudio.apk > watermark-studio-apk/WatermarkStudio.apk.sha256
          echo "SUCCESS" > watermark-studio-apk/BUILD_STATUS.txt

      - name: Publish APK to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Watermark Studio Builder"
          git config user.email "actions@github.com"
          git add watermark-studio-apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Watermark Studio APK [skip ci]"
            git push origin HEAD:watermark-studio
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkStudio-APK
          path: watermark-studio-apk/*
          if-no-files-found: error

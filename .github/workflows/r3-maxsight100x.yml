name: R3 Build MaxSight 100X

on:
  push:
    branches: [r3-maxsight100x-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct MaxSight project
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/maxsight.zip
          rm -rf /tmp/maxsight
          mkdir -p /tmp/maxsight
          unzip -q /tmp/maxsight.zip -d /tmp/maxsight
      - name: Build release APK
        working-directory: /tmp/maxsight/MaxSight100X
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxSight100X-R3-APK
          path: /tmp/maxsight/MaxSight100X/app/build/outputs/apk/release/app-release-unsigned.apk

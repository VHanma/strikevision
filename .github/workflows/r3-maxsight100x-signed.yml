name: R3 MaxSight 100X Runtime-Tested APK

on:
  push:
    branches: [r3-maxsight100x-build]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reconstruct and harden MaxSight
        shell: bash
        run: |
          python3 - <<'PY'
          import re, base64, pathlib
          s = pathlib.Path('.github/workflows/r3-maxsight100x.yml').read_text()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d", s)
          if not m: raise SystemExit('embedded project not found')
          pathlib.Path('/tmp/maxsight.zip').write_bytes(base64.b64decode(m.group(1)))
          PY
          rm -rf /tmp/maxsight && mkdir -p /tmp/maxsight
          unzip -q /tmp/maxsight.zip -d /tmp/maxsight
          cat > /tmp/maxsight/MaxSight100X/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          EOF
          SRC=/tmp/maxsight/MaxSight100X/app/src/main/java/com/hanma/maxsight/MainActivity.java
          sed -i 's/import androidx.appcompat.app.AppCompatActivity;/import androidx.activity.ComponentActivity;/' "$SRC"
          sed -i 's/public class MainActivity extends AppCompatActivity/public class MainActivity extends ComponentActivity/' "$SRC"
          sed -i 's/Presentation.createForShortSide(1080)/Presentation.createForHeight(1080)/' "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/maxsight/MaxSight100X/app/src/main/java/com/hanma/maxsight/MainActivity.java')
          s=p.read_text().replace('        goImmersive();\n        buildUi();','        buildUi();\n        previewView.post(this::safeImmersive);')
          s=s.replace('    private void goImmersive() {','    private void safeImmersive() {\n        try { goImmersive(); } catch (Throwable ignored) {}\n    }\n\n    private void goImmersive() {')
          p.write_text(s)
          PY
      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build signed APK
        working-directory: /tmp/maxsight/MaxSight100X
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Runtime launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: |
            APK=/tmp/maxsight/MaxSight100X/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb logcat -c
            adb shell pm grant com.hanma.maxsight android.permission.CAMERA || true
            adb shell pm grant com.hanma.maxsight android.permission.RECORD_AUDIO || true
            adb shell am force-stop com.hanma.maxsight
            adb shell am start -W -n com.hanma.maxsight/.MainActivity
            sleep 10
            adb logcat -d > /tmp/maxsight-logcat.txt
            PID=$(adb shell pidof com.hanma.maxsight | tr -d '\r')
            echo "PID=$PID"
            if [ -z "$PID" ]; then
              grep -A100 -B30 -E 'AndroidRuntime|FATAL EXCEPTION|com.hanma.maxsight' /tmp/maxsight-logcat.txt | tail -300
              exit 1
            fi
            if grep -q 'FATAL EXCEPTION' /tmp/maxsight-logcat.txt; then
              grep -A100 -B30 'FATAL EXCEPTION' /tmp/maxsight-logcat.txt
              exit 1
            fi
            echo MAXSIGHT_RUNTIME_LAUNCH_OK
      - name: Stage APK
        run: cp /tmp/maxsight/MaxSight100X/app/build/outputs/apk/debug/app-debug.apk /tmp/MaxSight100X-R3-RUNTIME-TESTED.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxSight100X-R3-RUNTIME-TESTED
          path: /tmp/MaxSight100X-R3-RUNTIME-TESTED.apk
          if-no-files-found: error

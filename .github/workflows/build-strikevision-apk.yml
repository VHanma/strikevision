name: Build StrikeVision Omega APK

on:
  workflow_dispatch:
  push:
    branches: [ main, omega-v4-complete ]
    paths:
      - 'native-apk/**'
      - '!native-apk/releases/**'
      - '.github/workflows/build-strikevision-apk.yml'

permissions:
  contents: write

jobs:
  build-strikevision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build StrikeVision Omega 4
        shell: bash
        run: |
          set -euo pipefail
          cd native-apk
          gradle --no-daemon clean assembleDebug --stacktrace
          cd ..
          mkdir -p native-apk/releases
          cp native-apk/app/build/outputs/apk/debug/app-debug.apk native-apk/releases/StrikeVision-Omega-v4-debug.apk
          sha256sum native-apk/releases/StrikeVision-Omega-v4-debug.apk > native-apk/releases/StrikeVision-Omega-v4-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeVision-Omega-v4-debug
          path: |
            native-apk/releases/StrikeVision-Omega-v4-debug.apk
            native-apk/releases/StrikeVision-Omega-v4-debug.apk.sha256
          if-no-files-found: error

      - name: Publish APK to repository
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "StrikeVision Builder"
          git config user.email "actions@github.com"
          git add native-apk/releases
          if ! git diff --cached --quiet; then
            git commit -m "Publish StrikeVision Omega v4 debug APK [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            echo "Could not publish generated APK after 3 rebased attempts" >&2
            exit 1
          fi

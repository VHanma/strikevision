name: Build Hanma Anatomy 3D APK

on:
  push:
    branches:
      - hanma-anatomy-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct project
        run: |
          rm -rf HanmaAnatomy3D
          mkdir HanmaAnatomy3D
          unzip -q hanma-anatomy-source.zip -d HanmaAnatomy3D
          find HanmaAnatomy3D -maxdepth 3 -type f | sort

      - name: Build installable debug APK
        run: gradle -p HanmaAnatomy3D --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=HanmaAnatomy3D/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -20

      - name: Rename APK
        run: cp HanmaAnatomy3D/app/build/outputs/apk/debug/app-debug.apk Hanma-Anatomy-3D-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanma-Anatomy-3D-APK
          path: Hanma-Anatomy-3D-v1.0.apk
          if-no-files-found: error
          retention-days: 30

name: Build Character Room APK
on:
  push:
    branches: [ character-room-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p characterroom :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CharacterRoom-v1-debug-apk
          path: characterroom/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

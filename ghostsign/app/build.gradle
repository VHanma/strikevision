plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghostsign.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghostsign.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.3-hybrid-text-image'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
